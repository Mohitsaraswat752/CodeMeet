name: CodeMeet Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./client

      - name: Run ESLint
        run: npm run lint
        working-directory: ./client

      - name: Build frontend
        run: npm run build
        working-directory: ./client